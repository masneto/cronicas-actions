name: "[Cronicas] CI Actions"

run-name: "Build Actions #${{ github.run_number }} by ${{ github.actor }} "

on:
  push:
    branches:
      - "feature/*"
    paths:
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Builda All Actions (only main)"
        required: false
        default: true
        type: boolean

jobs:
  validate-and-build-actions:
    name: Validate & Build Changed Actions
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Identify Changed Actions
        id: changed-actions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANGED_DIRS=$(find .github/actions -mindepth 1 -maxdepth 1 -type d | sort)
          else
            CHANGED_DIRS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep '^\.github/actions/' | cut -d'/' -f1-3 | sort -u || true)
          fi
          echo "Found changed action directories:"
          echo "$CHANGED_DIRS"
          CHANGED_DIR=$(echo "$CHANGED_DIRS" | tr '\n' ' ')
          echo "actions=$CHANGED_DIR"
          echo "actions=$CHANGED_DIR" >> "$GITHUB_ENV"

      - name: Process Actions and Commit Changes
        if: env.actions != ''
        run: |
          for action in ${{ env.actions }}; do
            echo "::group::Processing $action"
            cd "$action"

            if [ -f package.json ]; then
              echo "Installing dependencies..."
              npm ci

              echo "Running linter..."
              npm run lint

              echo "Running tests..."
              npm test

              echo "Building action..."
              npm run build
            else
              echo "Skipping $action (no package.json found)"
            fi

            cd - > /dev/null
            echo "::endgroup::"
          done

      - name: Commit and Push Dist Changes (feature)
        if: github.event_name == 'push' && env.actions != ''
        run: |
          echo "::group::Commit and Push Dist Changes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          git commit -m "Atualização de build da(s) action(s): ${{ env.actions }}"
          git push https://x-access-token:${{ secrets.PAT_GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }} --force
          echo "::endgroup::"

      - name: Create Pull Request with all action builds
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
          base: main
          branch: automation/build-all-actions-${{ github.run_number }}
          delete-branch: true
          commit-message: "chore: rebuild all actions"
          title: "chore: rebuild all GitHub Actions"
          body: "Build automatizado de todas as actions em .github/actions."
          labels: |
            automation
            dependencies

      - name: Merge rebuild Pull Request
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.create-pr.outputs.pull-request-number != ''
        run: |
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: token ${{ secrets.PAT_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.create-pr.outputs.pull-request-number }}/merge" \
            -d '{"commit_title":"chore: rebuild all GitHub Actions","merge_method":"squash"}'
