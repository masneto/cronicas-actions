name: "[Cronicas] CI Actions"

run-name: "Build Actions #${{ github.run_number }} by ${{ github.actor }} "

on:
  push:
    branches:
      - "feature/*"
      - "main"
    paths:
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Builda All Actions (only main)"
        required: false
        default: true
        type: boolean

jobs:
  validate-and-build-actions:
    name: Validate & Build Changed Actions
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Identify Changed Actions
        id: changed-actions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANGED_DIRS=$(find .github/actions -mindepth 1 -maxdepth 1 -type d | sort)
          else
            CHANGED_DIRS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep '^\.github/actions/' | cut -d'/' -f1-3 | sort -u || true)
          fi
          echo "Found changed action directories:"
          echo "$CHANGED_DIRS"
          CHANGED_DIR=$(echo "$CHANGED_DIRS" | tr '\n' ' ')
          echo "actions=$CHANGED_DIR"
          echo "actions=$CHANGED_DIR" >> "$GITHUB_ENV"

      - name: Process Actions and Commit Changes
        if: env.actions != ''
        id: process-actions
        run: |
          BUILD_CHANGES=false
          for action in ${{ env.actions }}; do
            echo "::group::Processing $action"
            cd "$action"

            if [ -f package.json ]; then
              echo "Install dependencies..."
              npm install

              echo "Installing dependencies from lockfile..."
              npm ci

              echo "Running linter..."
              npm run lint

              echo "Building action..."
              npm run build

              if [ -z "$(git status --porcelain -- dist/index.js)" ]; then
                echo "Build result for $action: no changes in dist/index.js."
              else
                echo "Build result for $action: dist/index.js was updated."
                BUILD_CHANGES=true
              fi
            else
              echo "Skipping $action (no package.json found)"
            fi

            cd - > /dev/null
            echo "::endgroup::"
          done
          echo "build-changes=$BUILD_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Commit and Push Dist Changes
        if: steps.process-actions.outputs.build-changes == 'true'
        continue-on-error: true
        run: |
          echo "::group::Commit and Push Dist Changes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          git commit -m "Atualização de build da(s) action(s): ${{ env.actions }}"
          git push https://x-access-token:${{ secrets.PAT_GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }} --force
          echo "::endgroup::"

      - name: Create Pull Request for Feature Build
        if: steps.process-actions.outputs.build-changes == 'true' && startsWith(github.ref_name, 'feature/')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
          base: main
          branch: automation/build-actions-${{ github.run_number }}
          delete-branch: true
          commit-message: "chore: rebuild actions from ${{ github.ref_name }}"
          title: "chore: rebuild GitHub Actions (${{ github.ref_name }})"
          body: |
            Build automatizado das GitHub Actions originado pela branch `${{ github.ref_name }}`.

            Este PR deve ser avaliado antes de entrar na `main`.
          labels: |
            automation
            dependencies
