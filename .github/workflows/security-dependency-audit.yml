name: "[Cronicas] Security Audit - Dependency Audit (NPM & Python)"

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - 'main'
    paths:
      - '.github/actions/dependency-security-audit/**'
  workflow_dispatch:

jobs:
  audit:
    name: Audit & Fix Dependency Security Action
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .github/actions/dependency-security-audit/package-lock.json

      - name: Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Validação / Auditoria NPM
      - name: Audit dependency security audit action (npm)
        id: audit_npm
        uses: masneto/cronicas-actions/.github/actions/dependency-security-audit@main
        with:
          tech: npm
          working-directory: .github/actions/dependency-security-audit
          package-label: Dependency Security Audit Action (npm)

      # Validação / Auditoria Python
      - name: Audit dependency security audit action (python)
        id: audit_python
        uses: masneto/cronicas-actions/.github/actions/dependency-security-audit@main
        with:
          tech: python
          working-directory: .github/actions/dependency-security-audit
          package-label: Dependency Security Audit Action (python)

      # Atualiza changelog consolidado caso haja vulnerabilidades em qualquer uma das techs
      - name: Update security changelog
        if: steps.audit_npm.outputs.had-vulnerabilities == 'true' || steps.audit_python.outputs.had-vulnerabilities == 'true'
        uses: masneto/cronicas-actions/.github/actions/dependency-security-audit@main
        with:
          changelog-only: true
          changelog-file: SECURITY_FIXES.md
          changelog-entries: |-
            ${{ steps.audit_npm.outputs.changelog-entries }}
            ${{ steps.audit_python.outputs.changelog-entries }}

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: (steps.audit_npm.outputs.had-vulnerabilities == 'true' || steps.audit_python.outputs.had-vulnerabilities == 'true') && steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'fix(security): dependency security audit fixes (npm & python)'
          title: 'Security: dependency audit fixes (${{ github.run_id }})'
          body: |
            ## Automatic Security Update

            This PR contains security fixes for `dependency-security-audit` across supported techs (npm & python).

            See the workflow summary for package names, severities, affected ranges,
            available fixes, before/after counts, and updated versions.

            The detailed history is also recorded in `SECURITY_FIXES.md`.
          branch: security/dependency-audit-fixes
          delete-branch: true
          labels: |
            security
            dependencies
            automated
          reviewers: masneto

      - name: Merge Pull Request
        if: steps.pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/merge" \
            -d '{"commit_title":"fix(security): dependency security audit fixes","merge_method":"squash"}'

