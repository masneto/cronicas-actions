name: Security Audit - cronicas-actions-test

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - ".github/actions/**" #remover depois       
  workflow_dispatch:

jobs:
  audit:
    name: Audit & Fix Actions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            .github/actions/email-notification-action/package-lock.json
            .github/actions/npm-security-audit/package-lock.json
            .github/actions/preview-docs-action/package-lock.json
            .github/actions/validate-repo/package-lock.json

      - name: Audit, fallback fix and validate actions
        id: audit
        shell: bash
        run: |
          set -eo pipefail

          HAD_VULNS=false
          UNRESOLVED_HIGH_CRITICAL=0
          DATE=$(date -u '+%Y-%m-%d')
          PIPELINE="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CHANGELOG_ENTRIES=""
          OVERRIDE_HTTP_CLIENT_VERSION='^3.0.2'
          OVERRIDE_UNDICI_VERSION='^6.28.1'

          audit_count() {
            local FILE="$1"
            jq '(.metadata.vulnerabilities.moderate // 0) + (.metadata.vulnerabilities.high // 0) + (.metadata.vulnerabilities.critical // 0)' "$FILE" 2>/dev/null || echo 0
          }

          high_critical_count() {
            local FILE="$1"
            jq '(.metadata.vulnerabilities.high // 0) + (.metadata.vulnerabilities.critical // 0)' "$FILE" 2>/dev/null || echo 0
          }

          apply_override_fallback() {
            (
              set -e
              local BACKUP_FILE
              BACKUP_FILE="$(mktemp)"
              cp package.json "$BACKUP_FILE"
              cleanup_package_json() {
                if [ -f "$BACKUP_FILE" ]; then
                  mv "$BACKUP_FILE" package.json
                fi
              }
              trap cleanup_package_json EXIT INT TERM
              node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.overrides=j.overrides||{};if (j.overrides['@actions/http-client'] !== '${OVERRIDE_HTTP_CLIENT_VERSION}') j.overrides['@actions/http-client']='${OVERRIDE_HTTP_CLIENT_VERSION}'; if (j.overrides.undici !== '${OVERRIDE_UNDICI_VERSION}') j.overrides.undici='${OVERRIDE_UNDICI_VERSION}';fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
              npm install --package-lock-only --force --ignore-scripts --no-audit
            )
          }

          for SPEC in \
            "Email Notification Action|.github/actions/email-notification-action" \
            "NPM Security Audit Action|.github/actions/npm-security-audit" \
            "Preview Docs Action|.github/actions/preview-docs-action" \
            "Validate Repo Action|.github/actions/validate-repo"; do

            LABEL="${SPEC%%|*}"
            DIR="${SPEC##*|}"
            BEFORE_JSON="$(mktemp)"
            AFTER_FIX_JSON="$(mktemp)"
            AFTER_EXPLICIT_JSON="$(mktemp)"
            FINAL_JSON="$(mktemp)"
            REASONS=""
            EXPLICIT_FALLBACK_APPLIED=false
            OVERRIDE_FALLBACK_APPLIED=false

            echo "Installing dependencies in $DIR"
            npm ci --prefix "$DIR" --no-audit --loglevel error

            pushd "$DIR" >/dev/null
            npm audit --json > "$BEFORE_JSON" 2>/dev/null || true
            BEFORE="$(audit_count "$BEFORE_JSON")"
            [ "$BEFORE" -gt 0 ] && HAD_VULNS=true

            npm audit fix --force || true
            npm audit --json > "$AFTER_FIX_JSON" 2>/dev/null || true

            FIXES="$(jq -r '
              .vulnerabilities
              | to_entries[]
              | .value.fixAvailable
              | select(type == "object" and .name and .version)
              | "\(.name)@\(.version)"
            ' "$AFTER_FIX_JSON" 2>/dev/null | sort -u || true)"

            while IFS= read -r PACKAGE; do
              if [ -n "$PACKAGE" ]; then
                npm install --package-lock-only --force --ignore-scripts --no-audit --no-save "$PACKAGE"
                EXPLICIT_FALLBACK_APPLIED=true
              fi
            done <<< "$FIXES"
            npm audit --json > "$AFTER_EXPLICIT_JSON" 2>/dev/null || true
            AFTER_EXPLICIT="$(audit_count "$AFTER_EXPLICIT_JSON")"

            if [ "$EXPLICIT_FALLBACK_APPLIED" = true ]; then
              REASONS="Fallback aplicado: atualização explícita via fixAvailable."
            fi

            OVERRIDE_KEYS_TO_APPLY=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));const o=j.overrides||{};const keys=[];if (o['@actions/http-client'] !== '${OVERRIDE_HTTP_CLIENT_VERSION}') keys.push('@actions/http-client'); if (o.undici !== '${OVERRIDE_UNDICI_VERSION}') keys.push('undici'); process.stdout.write(keys.join(','));")
            if [ "$AFTER_EXPLICIT" -gt 0 ] && [ -n "$OVERRIDE_KEYS_TO_APPLY" ]; then
              if apply_override_fallback; then
                OVERRIDE_FALLBACK_APPLIED=true
              else
                exit $?
              fi
            elif [ "$AFTER_EXPLICIT" -gt 0 ]; then
              REASONS="${REASONS} Fallback de overrides ignorado (valores já estavam nas versões-alvo)."
            else
              REASONS="${REASONS} Fallback de overrides não necessário (vulnerabilidades resolvidas antes desta etapa)."
            fi

            if [ "$OVERRIDE_FALLBACK_APPLIED" = true ] && [ -n "$REASONS" ]; then
              REASONS="$REASONS Fallback aplicado: overrides para @actions/http-client e undici."
            elif [ "$OVERRIDE_FALLBACK_APPLIED" = true ]; then
              REASONS="Fallback aplicado: overrides para @actions/http-client e undici."
            elif [ -z "$REASONS" ]; then
              REASONS="Nenhum fallback aplicado."
            fi

            npm audit --json > "$FINAL_JSON" 2>/dev/null || true
            AFTER="$(audit_count "$FINAL_JSON")"
            FIXED=$((BEFORE - AFTER))
            [ "$FIXED" -lt 0 ] && FIXED=0
            REMAINING_HIGH_CRITICAL="$(high_critical_count "$FINAL_JSON")"
            UNRESOLVED_HIGH_CRITICAL=$((UNRESOLVED_HIGH_CRITICAL + REMAINING_HIGH_CRITICAL))

            echo "## $LABEL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Corrigidas: **$FIXED**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Não corrigidas: **$AFTER**" >> "$GITHUB_STEP_SUMMARY"
            if [ "$AFTER" -eq 0 ]; then
              echo "- Motivo: _corrigido por npm audit fix e/ou fallback_" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Motivo: _vulnerabilidades remanescentes após fallback_." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- Ação de fallback aplicada: $REASONS" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            REMAINING_LINES="$(jq -r --arg label "$LABEL" '
              .vulnerabilities
              | to_entries[]
              | "- **\($label):** \(.key) `\(.value.via[0].range // "?")` → disponível: `\(.value.fixAvailable.version // "não informado")` — _\(.value.via[0].title // \(.value.via[0] // "sem detalhes"))_ (\(.value.severity), remanescente após o fix)"
            ' "$FINAL_JSON" 2>/dev/null || true)"

            if [ -n "$REMAINING_LINES" ]; then
              CHANGELOG_ENTRIES="${CHANGELOG_ENTRIES}${REMAINING_LINES}"$'\n'
            fi
            popd >/dev/null
          done

          if [ -n "$CHANGELOG_ENTRIES" ]; then
            printf "\n## %s\n%b- Pipeline: %s\n" "$DATE" "$CHANGELOG_ENTRIES" "$PIPELINE" >> "$GITHUB_WORKSPACE/SECURITY_FIXES.md"
          fi

          echo "had_vulns=$HAD_VULNS" >> "$GITHUB_OUTPUT"
          if [ "$UNRESOLVED_HIGH_CRITICAL" -gt 0 ]; then
            echo "Ainda restam $UNRESOLVED_HIGH_CRITICAL vulnerabilidades high/critical após fallback." >&2
            exit 1
          fi

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            HAS_ALLOWED_LOCKFILE_CHANGE=false
            ONLY_ALLOWED_FILES=true
            while IFS= read -r FILE; do
              case "$FILE" in
                ".github/actions/email-notification-action/package-lock.json"|".github/actions/npm-security-audit/package-lock.json"|".github/actions/preview-docs-action/package-lock.json"|".github/actions/validate-repo/package-lock.json")
                  HAS_ALLOWED_LOCKFILE_CHANGE=true
                  ;;
                *)
                  ONLY_ALLOWED_FILES=false
                  ;;
              esac
            done < <(git diff --name-only)

            if [ "$HAS_ALLOWED_LOCKFILE_CHANGE" = true ] && [ "$ONLY_ALLOWED_FILES" = true ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create Pull Request
        if: steps.audit.outputs.had_vulns == 'true' && steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'fix(security): npm audit fixes'
          title: 'Security: npm audit fixes (${{ github.run_id }})'
          body: |
            ## Automatic Security Update

            This PR contains security fixes detected by `npm audit` in the shared GitHub Actions.

            See the workflow summary for the complete before/after report and updated packages.
            The detailed history is recorded in `SECURITY_FIXES.md`.
          branch: security/npm-audit-fixes-test
          delete-branch: true
          labels: |
            security
            dependencies
            automated
          reviewers: |
            masneto

      # - name: Merge Pull Request
      #   if: steps.pr.outputs.pull-request-number != ''
      #   shell: bash
      #   run: |
      #     curl -s -X PUT \
      #       -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
      #       -H "Accept: application/vnd.github.v3+json" \
      #       "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.pull-request-number }}/merge" \
      #       -d "{\n              \"commit_title\": \"fix(security): npm audit fixes\",\n              \"merge_method\": \"squash\"\n            }"
