name: "[Cronicas] CI Dependency Security Audit Action"

run-name: "Build Dependency Security Audit Action #${{ github.run_number }} by ${{ github.actor }}"

on:
  push:
    branches:
      - "feature/*"
      - "main"
    paths:
      - ".github/actions/dependency-security-audit/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Build Action (only main)"
        required: false
        default: true
        type: boolean

jobs:
  validate-and-build-dependency-action:
    name: Validate & Build Dependency Security Audit Action
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------
      # RUNTIME ENVIRONMENTS SETUP (Node, Python & Future Techs)
      # -----------------------------------------------------------
      - name: Setup Node.js (Node / TypeScript runtime)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ".github/actions/dependency-security-audit/package-lock.json"

      - name: Setup Python (Python runtime & testing environment)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # - name: Setup Go (Future Tech template)
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version: 'stable'

      # - name: Setup Java (Future Tech template)
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: 'temurin'
      #     java-version: '21'

      # - name: Setup Rust (Future Tech template)
      #   uses: dtolnay/rust-toolchain@stable

      # -----------------------------------------------------------
      # TECH 1: PYTHON ENVIRONMENT & TOOLING VALIDATION
      # -----------------------------------------------------------
      - name: Validate Python Environment & Tools
        run: |
          echo "::group::Validating Python Tooling"
          python --version
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit --version
          echo "::endgroup::"

      # -----------------------------------------------------------
      # TECH 2: NODE / TYPESCRIPT ACTION BUILD & VALIDATION
      # -----------------------------------------------------------
      - name: Process Action and Build
        id: process-action
        run: |
          BUILD_CHANGES=false
          ACTION_DIR=".github/actions/dependency-security-audit"

          echo "::group::Processing $ACTION_DIR"
          cd "$ACTION_DIR"

          if [ -f package.json ]; then
            echo "Installing dependencies..."
            npm ci

            if npm run | grep -q 'lint'; then
              echo "Running linter..."
              npm run lint
            fi

            echo "Building action with ncc..."
            npm run build

            if [ -n "$(git status --porcelain -- dist/index.js)" ]; then
              echo "Build result: dist/index.js was updated."
              BUILD_CHANGES=true
            else
              echo "Build result: no changes in dist/index.js."
            fi
          fi

          cd - > /dev/null
          echo "::endgroup::"

          echo "build-changes=$BUILD_CHANGES" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------
      # COMMIT & PR CREATION (Baseado no ci-actions.yml)
      # -----------------------------------------------------------
      - name: Commit and Push Dist Changes
        if: steps.process-action.outputs.build-changes == 'true'
        continue-on-error: true
        run: |
          echo "::group::Commit and Push Dist Changes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/actions/dependency-security-audit/dist
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          git commit -m "chore(build): update dist for dependency-security-audit action"
          git push https://x-access-token:${{ secrets.PAT_GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }} --force
          echo "::endgroup::"

      - name: Create Pull Request for Feature Build
        if: steps.process-action.outputs.build-changes == 'true' && startsWith(github.ref_name, 'feature/')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
          base: main
          branch: automation/build-dependency-audit-${{ github.run_number }}
          delete-branch: true
          commit-message: "chore: rebuild dependency-security-audit action from ${{ github.ref_name }}"
          title: "chore: rebuild dependency-security-audit action (${{ github.ref_name }})"
          body: |
            Build automatizado da action dependency-security-audit originado pela branch `${{ github.ref_name }}`.

            Este PR deve ser avaliado antes de entrar na `main`.
          labels: |
            automation
            dependencies
