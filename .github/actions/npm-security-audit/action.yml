# CI validation marker
name: 'NPM Security Audit'
description: 'Audita dependencias npm, aplica correcoes e reporta vulnerabilidades e pacotes atualizados.'
author: 'Cronicas Team'

inputs:
  working-directory:
    description: 'Diretorio do pacote npm relativo a raiz do repositorio.'
    required: false
    default: '.'
  package-label:
    description: 'Nome exibido no resumo do workflow.'
    required: false
    default: 'Package'
  changelog-file:
    description: 'Caminho do arquivo markdown com o historico de vulnerabilidades (relativo a raiz do repositorio).'
    required: false
    default: 'SECURITY_FIXES.md'
  changelog-only:
    description: 'Se true, a action nao executa auditoria: apenas atualiza o changelog com a entrada changelog-entries.'
    required: false
    default: 'false'
  changelog-entries:
    description: 'Entradas agregadas (multiline) gravadas na secao do dia quando changelog-only=true.'
    required: false
    default: ''

outputs:
  had-vulnerabilities:
    description: 'true quando havia vulnerabilidades (qualquer severidade) antes do fix.'
  before:
    description: 'Quantidade de vulnerabilidades antes do fix.'
  after:
    description: 'Quantidade de vulnerabilidades depois do fix.'
  audit-before-file:
    description: 'Caminho do JSON de auditoria capturado antes do fix.'
  changelog-entries:
    description: 'Linhas de changelog (uma por vulnerabilidade, ou "sem vulnerabilidades") para o workflow agregar.'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'shield'
  color: 'orange'